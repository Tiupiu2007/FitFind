<!doctype html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FitFind — Trova il tuo fit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header><a class="logo" href="#">Fit<span>Find</span></a><b>PROTOTIPO</b></header>
    <main>
        <section class="hero"><small>CERCA · CONFRONTA · SCEGLI</small>
            <h1>Trova quello che cerchi.<br><em>Al prezzo giusto.</em></h1>
            <p>Cerca vestiti e accessori tra più negozi senza aprire dieci schede.</p>
            <div class="search"><input id="search" placeholder="Es. maglia nera oversize..."><button
                    id="go">Cerca</button></div>
            <nav><button data-q="maglia">Maglie</button><button data-q="felpa">Felpe</button><button
                    data-q="pantaloni">Pantaloni</button><button data-q="scarpe">Scarpe</button></nav>
        </section>
        <section class="results">
            <div class="bar">
                <div><small>RISULTATI</small>
                    <h2 id="title">Tutto</h2>
                </div>
                <div><input id="max" type="number" min="0" placeholder="Prezzo max €"><select id="sort">
                        <option value="rel">Rilevanza</option>
                        <option value="asc">Prezzo ↑</option>
                        <option value="desc">Prezzo ↓</option>
                    </select></div>
            </div>
            <div id="grid" class="grid"></div>
            <div id="empty" class="empty hidden">
                <h3>Nessun prodotto trovato</h3>
                <p>Prova a cambiare ricerca o prezzo massimo.</p>
            </div>
        </section>
    </main>
    <footer>FitFind · Prototipo gratuito · dati demo</footer>
    <script src="app.js"></script>
</body>

</html>
